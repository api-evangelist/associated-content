name: Associated Content
description: 'Associated Content was an open content publishing platform founded in 2005 by Luke Beatty
  that paid contributors to publish articles, video, audio, and images on any topic, then distributed
  that library through associatedcontent.com and a network of syndication partners. At its peak it hosted
  over one million pieces of content from roughly 250,000 contributors and adopted Thomson Reuters
  OpenCalais for automated classification of that library. It raised a $5.4M Series A from SoftBank Capital
  (2006), a $10M Series B from SoftBank, Canaan Partners, and Tim Armstrong (2007), and $6M more in 2009,
  before Yahoo acquired it in May 2010. Yahoo rebranded the property as Yahoo Voices in December 2011 and
  shut it down on July 31, 2014, retiring the Yahoo Contributor Network the following month. The company
  is defunct: it never published a public developer API, and associatedcontent.com is now a parked domain
  that refuses HTTPS.'
